name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Find project folder
        run: |
          f=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts 파일을 찾지 못했어요. 아래 파일 목록을 캡처해 주세요."
            find . -not -path "./.git/*" -type f | head -80
            exit 1
          fi
          echo "PROJ=$(dirname "$f")" >> "$GITHUB_ENV"
          echo "프로젝트 폴더: $(dirname "$f")"
      - name: Build debug APK
        run: cd "$PROJ" && gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" kkoko-tamagotchi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kkoko-tamagotchi-apk
          path: kkoko-tamagotchi.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest kkoko-tamagotchi.apk --title "꼬꼬 다마고찌 최신 APK" --notes "자동 빌드"
